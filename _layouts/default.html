<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <!-- PASTIKAN pakai relative_url -->
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/search' | relative_url }}">Search</a>
        <a href="{{ '/komunitas' | relative_url }}">Komunitas</a>
      </nav>
    </header>

    <div class="container">
      <main class="content">
        {{ content }}
      </main>
      <aside class="sidebar">
        {% include sidebar.html %}
      </aside>
    </div>
        <!-- Bagian Footer dan Visitor Counter -->
    <footer>
      <p>Total pengunjung: 
        <img src="https://hits.sh" alt="Visitor Counter" style="vertical-align: middle;">
      </p>
      <p>&copy; 2026 alteriza</p>
    </footer>
  </div> <!-- Penutup class container Anda -->
</body>
</html>

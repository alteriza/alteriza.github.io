<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <!-- PASTIKAN pakai relative_url -->
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/search' | relative_url }}">Search</a>
        <a href="{{ '/komunitas' | relative_url }}">Komunitas</a>
      </nav>
    </header>

    <div class="container">
      <main class="content">
        {{ content }}
      </main>
      <aside class="sidebar">
        {% include sidebar.html %}
      </aside>
    </div>
    <footer>
  <p>Total pengunjung: <span id="visitor-counter">0</span></p>
  <p>&copy; 2026 alteriza</p>
</footer>

<!-- 1. Memuat Pustaka Resmi CounterAPI via CDN -->
<script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>

<!-- 2. Menjalankan Fungsi Hitung Pengunjung -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Inisialisasi menggunakan nama blog Anda sebagai ruang kerja (workspace)
    const counter = new Counter({
      workspace: 'alteriza-blog'
    });

    // Menambahkan hitungan (up) pada data berlabel 'homepage-visits'
    counter.up('homepage-visits')
      .then(result => {
        // Memasukkan hasil angka langsung ke elemen teks halaman blog
        document.getElementById('visitor-counter').innerText = result.value;
      })
      .catch(error => {
        console.error('Eror Counter:', error);
        document.getElementById('visitor-counter').innerText = '?';
      });
  });
</script>
</body>
</html>

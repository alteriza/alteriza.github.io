<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <!-- PASTIKAN pakai relative_url -->
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/search' | relative_url }}">Search</a>
        <a href="{{ '/komunitas' | relative_url }}">Komunitas</a>
      </nav>
    </header>

    <div class="container">
      <main class="content">
        {{ content }}
      </main>
      <aside class="sidebar">
        {% include sidebar.html %}
      </aside>
    </div>

    <footer>
  <p>Total pengunjung: <span id="visitor-counter">0</span></p>
  <p>&copy; 2025 alteriza</p>
</footer>

<!-- Visitor counter baru menggunakan CounterAPI -->
<script>
  // Menggunakan nama repositori Anda sebagai ID unik agar hitungannya akurat
  fetch('https://counterapi.dev')
    .then(res => res.json())
    .then(data => {
      // CounterAPI mengembalikan data berupa objek { count: nilai }
      document.getElementById('visitor-counter').innerText = data.count;
    })
    .catch(() => {
      document.getElementById('visitor-counter').innerText = '?';
    });
</script>
</body>
</html>

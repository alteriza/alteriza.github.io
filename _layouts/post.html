---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    <span>{{ page.date | date: "%d %B %Y" }}</span>
    <span>Kategori: {{ page.categories | join: ', ' }}</span>
  </div>
  <div class="post-content">
    {{ content }}
  </div>

  <!-- Giscus Comments -->
  <div class="comments">
    <h3>💬 Diskusi thread ini</h3>
    <script src="https://giscus.app/client.js"
        data-repo="alteriza/alteriza.github.io"
        data-repo-id="R_kgDOSlpSHw"
        data-category="General"
        data-category-id="DIC_kwDOSlpSH84C9q56"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="id"
        crossorigin="anonymous"
        async>
    </script>
  </div>
</article>

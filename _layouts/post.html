---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    <span>{{ page.date | date: "%d %B %Y" }}</span>
    <span>Kategori: {{ page.categories | join: ', ' }}</span>
  </div>
  <div class="post-content">
    {{ content }}
  </div>

  <!-- Giscus Comments -->
  <div class="comments">
    <h3>💬 Diskusi thread ini</h3>
    <script src="https://giscus.app/client.js"
      data-repo="alteriza/alteriza.github.io"
      data-repo-id="[REPO_ID_KAMU]"
      data-category="Announcements"
      data-category-id="[CATEGORY_ID_KAMU]"
      data-mapping="title"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="dark"
      data-lang="id"
      data-loading="lazy"
      crossorigin="anonymous"
      async>
    </script>
  </div>
</article>

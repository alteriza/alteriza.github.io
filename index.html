<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Protocol404 Blog | Catatan & Komunitas</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="animated-bg"></div>

  <!-- Header / Navbar -->
  <nav class="glass-nav">
    <div class="nav-container">
      <div class="logo">
        <span class="logo-text">Protocol<span class="accent">404</span></span>
        <span class="logo-badge">BLOG</span>
      </div>
      <div class="nav-links">
        <a href="#" data-page="home" class="nav-link active">Home</a>
        <a href="#" data-page="search" class="nav-link">Search</a>
        <a href="#" data-page="community" class="nav-link">Komunitas</a>
      </div>
      <div class="menu-toggle">
        <i class="fas fa-bars"></i>
      </div>
    </div>
  </nav>

  <!-- Main Konten Dinamis -->
  <main id="main-content">
    <!-- Halaman HOME akan diisi JS -->
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          <span class="logo-text">Protocol<span class="accent">404</span></span>
          <p>© 2025 - Open source blog</p>
        </div>
        <div class="footer-stats">
          <i class="fas fa-eye"></i> <span id="visitor-counter">0</span> total pengunjung
        </div>
        <div class="footer-credit">
          <p>Powered by <i class="fab fa-github"></i> & <i class="fas fa-heart"></i></p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Utterances Script akan dimuat saat halaman komunitas atau thread -->
  <script src="script.js"></script>
</body>
</html>

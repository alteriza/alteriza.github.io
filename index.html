---
layout: default
title: Home
---
<div class="home">
  <h2>Postingan Terbaru</h2>
  <ul>
    {% for post in site.posts limit:5 %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <span>{{ post.date | date: "%d %b %Y" }}</span>
      </li>
    {% endfor %}
  </ul>
</div>

---
layout: default
title: Cari Thread
permalink: /search/
---
<div class="search-page fade-up">
<div class="search-page">
  <h2>🔍 Cari artikel</h2>
  <input type="text" id="search-input" placeholder="Cari judul atau konten..." autocomplete="off">
  <div id="results-container" class="search-results"></div>
</div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results-container');
    let postsData = [];

    // Ambil data dari search.json
    fetch('/search.json')
      .then(response => response.json())
      .then(data => {
        postsData = data;
      })
      .catch(err => {
        console.error('Gagal memuat search.json:', err);
        resultsContainer.innerHTML = '<p>Gagal memuat data pencarian. Coba refresh halaman.</p>';
      });

    // Fungsi pencarian
    function performSearch() {
      const keyword = searchInput.value.toLowerCase().trim();
      if (!keyword) {
        resultsContainer.innerHTML = '';
        return;
      }
      const filtered = postsData.filter(post => 
        post.title.toLowerCase().includes(keyword) || 
        post.excerpt.toLowerCase().includes(keyword)
      );
      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<p>Tidak ada hasil yang cocok.</p>';
        return;
      }
      let html = '';
      filtered.forEach(post => {
        html += `
          <div class="search-item">
            <a href="${post.url}"><h3>${post.title}</h3></a>
            <div class="post-meta">${post.date}</div>
            <p>${post.excerpt}</p>
          </div>
        `;
      });
      resultsContainer.innerHTML = html;
    }

    searchInput.addEventListener('input', performSearch);
  });
</script>

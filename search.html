---
layout: default
title: Cari Thread
permalink: /search/
---
<div class="search-page">
  <h2>🔍 Cari artikel</h2>
  <input type="text" id="search-input" placeholder="Ketik judul atau kata kunci..." autocomplete="off">
  <div id="results-container" class="search-results"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Pastikan SimpleJekyllSearch sudah tersedia
    if (typeof SimpleJekyllSearch !== 'undefined') {
      SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        json: '/search.json',  // Lokasi file search.json di root
        searchResultTemplate: '<div class="search-item"><a href="{url}"><h3>{title}</h3></a><div class="post-meta">{date}</div><p>{excerpt}</p></div>',
        noResultsText: 'Tidak ada thread yang cocok',
        limit: 10,
        fuzzy: true
      });
    } else {
      console.error('SimpleJekyllSearch not loaded');
      document.getElementById('results-container').innerHTML = '<p>Error: library pencarian tidak dimuat. Coba refresh halaman.</p>';
    }
  });
</script>
